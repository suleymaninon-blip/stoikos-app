name: Deploy to GitHub Pages (yönlendirme)

# Asıl site artık https://stoikos.app — Cloudflare Pages, bu depoya bağlı
# (kök dizin = depo kökü, build komutu = bash scripts/build-site.sh, çıktı = site).
#
# Eski test adresi suleymaninon-blip.github.io/stoikos-app/... hâlâ elde
# dolaşıyor. Burada yalnız o adresleri yeni siteye gönderen bir yönlendirme
# sayfası yayınlanıyor; uygulamanın kendisi artık burada derlenmiyor.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build redirect site
        run: |
          mkdir site
          cat > site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="tr"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Stoikos taşındı</title>
          <link rel="canonical" href="https://stoikos.app/app/">
          <meta http-equiv="refresh" content="0; url=https://stoikos.app/app/">
          <script>location.replace('https://stoikos.app/app/');</script>
          <style>body{margin:0;background:#14120e;color:#c4a96a;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh}a{color:#c4a96a}</style>
          </head><body><p>Stoikos taşındı → <a href="https://stoikos.app/app/">stoikos.app</a></p></body></html>
          HTML
          cp site/index.html site/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
