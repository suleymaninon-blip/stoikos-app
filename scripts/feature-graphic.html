<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Uygulamanın kendi font dosyaları — node_modules'tan, ağ yok. */
  @font-face { font-family:'Cinzel'; font-weight:600;
    src:url('../node_modules/@expo-google-fonts/cinzel/Cinzel_600SemiBold.ttf') format('truetype'); }
  @font-face { font-family:'Cormorant'; font-style:italic; font-weight:400;
    src:url('../node_modules/@expo-google-fonts/cormorant-garamond/CormorantGaramond_400Regular_Italic.ttf') format('truetype'); }
  @font-face { font-family:'Jost'; font-weight:300;
    src:url('../node_modules/@expo-google-fonts/jost/Jost_300Light.ttf') format('truetype'); }

  /* constants/theme.ts ile birebir */
  :root {
    --bg:#14120e; --gold:#c2a878; --goldSoft:#d8c49a; --text:#ece4d4; --dim:#8a8070;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1024px; height:500px; overflow:hidden; }
  body { background:var(--bg); }

  .card {
    position:relative; width:1024px; height:500px; background:var(--bg); overflow:hidden;
  }
  /* Orbun arkasındaki sıcak hale — zemini tek renk bırakmıyor */
  .glow {
    position:absolute; right:-60px; top:50%; transform:translateY(-50%);
    width:660px; height:660px; border-radius:50%;
    background:radial-gradient(circle,
      rgba(194,168,120,.16) 0%, rgba(194,168,120,.07) 38%, rgba(194,168,120,0) 68%);
  }

  /* Nefes orbu — uygulamanın imza görseli */
  .orb-wrap {
    position:absolute; right:96px; top:50%; transform:translateY(-50%);
    width:300px; height:300px; display:grid; place-items:center;
  }
  .ring {
    position:absolute; border-radius:50%; border:1px solid rgba(194,168,120,.22);
  }
  .ring.r1 { width:300px; height:300px; }
  .ring.r2 { width:246px; height:246px; border-color:rgba(194,168,120,.3); }
  .orb {
    width:186px; height:186px; border-radius:50%;
    background:radial-gradient(circle at 38% 32%,
      #d8c49a 0%, #bda476 34%, #8a7550 66%, #4a4030 100%);
    box-shadow:0 0 68px rgba(194,168,120,.28);
  }

  .text {
    position:absolute; left:76px; top:50%; transform:translateY(-50%);
    width:560px; display:flex; flex-direction:column;
  }
  .omega {
    font-family:'Cinzel',serif; font-weight:600; font-size:30px;
    color:var(--gold); line-height:1; margin-bottom:20px;
  }
  .word {
    font-family:'Cinzel',serif; font-weight:600; font-size:66px; letter-spacing:11px;
    color:var(--goldSoft); line-height:1; margin-bottom:26px;
  }
  .tagline {
    font-family:'Cormorant',Georgia,serif; font-style:italic; font-weight:400;
    font-size:31px; line-height:1.32; color:var(--text); margin-bottom:22px;
  }
  .rule { width:64px; height:1px; background:rgba(194,168,120,.4); margin-bottom:20px; }
  .features {
    font-family:'Jost',sans-serif; font-weight:300; font-size:15px; letter-spacing:1.1px;
    color:var(--dim); line-height:1.5;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="glow"></div>
    <div class="orb-wrap">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="orb"></div>
    </div>
    <div class="text">
      <div class="omega">Ω</div>
      <div class="word">STOIKOS</div>
      <div class="tagline" id="tagline"></div>
      <div class="rule"></div>
      <div class="features" id="features"></div>
    </div>
  </div>
</body>
</html>
