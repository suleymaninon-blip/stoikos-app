<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Uygulamanın kendi font dosyaları — node_modules'tan, ağ yok. */
  @font-face { font-family:'Cinzel'; font-weight:600;
    src:url('../node_modules/@expo-google-fonts/cinzel/Cinzel_600SemiBold.ttf') format('truetype'); }
  @font-face { font-family:'Cormorant'; font-style:italic; font-weight:400;
    src:url('../node_modules/@expo-google-fonts/cormorant-garamond/CormorantGaramond_400Regular_Italic.ttf') format('truetype'); }
  @font-face { font-family:'Jost'; font-weight:300;
    src:url('../node_modules/@expo-google-fonts/jost/Jost_300Light.ttf') format('truetype'); }

  /* constants/theme.ts ile birebir */
  :root {
    --bg:#14120e; --gold:#c2a878; --goldSoft:#d8c49a; --text:#ece4d4; --dim:#8a8070;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1024px; height:500px; overflow:hidden; }
  body { background:var(--bg); }

  .card {
    position:relative; width:1024px; height:500px; background:var(--bg); overflow:hidden;
  }
  /* Orbun arkasındaki sıcak hale — zemini tek renk bırakmıyor */
  .glow {
    position:absolute; right:-60px; top:50%; transform:translateY(-50%);
    width:660px; height:660px; border-radius:50%;
    background:radial-gradient(circle,
      rgba(194,168,120,.16) 0%, rgba(194,168,120,.07) 38%, rgba(194,168,120,0) 68%);
  }

  /* Nefes çiçeği — uygulamanın imza görseli (Ekim 2026'da orbun yerini aldı).
     Altı saydam altın taç yaprağı; üst üste binen saydamlıklar merkezi parlatır. */
  .orb-wrap {
    position:absolute; right:96px; top:50%; transform:translateY(-50%);
    width:300px; height:300px; display:grid; place-items:center;
  }
  .ring {
    position:absolute; border-radius:50%; border:1px solid rgba(194,168,120,.22);
  }
  .ring.r1 { width:300px; height:300px; }
  .ring.r2 { width:246px; height:246px; border-color:rgba(194,168,120,.3); }
  .flower { position:absolute; width:300px; height:300px; }
  .petal {
    position:absolute; left:50%; top:50%; width:132px; height:132px; margin:-66px 0 0 -66px;
    border-radius:50%; border:1px solid rgba(250,228,180,.28);
    background:linear-gradient(150deg, rgba(232,206,150,.55) 0%, rgba(196,160,96,.32) 55%, rgba(150,118,66,.22) 100%);
    box-shadow:0 0 30px rgba(194,168,120,.10);
  }

  .text {
    position:absolute; left:76px; top:50%; transform:translateY(-50%);
    width:560px; display:flex; flex-direction:column;
  }
  .omega {
    font-family:'Cinzel',serif; font-weight:600; font-size:30px;
    color:var(--gold); line-height:1; margin-bottom:20px;
  }
  .word {
    font-family:'Cinzel',serif; font-weight:600; font-size:66px; letter-spacing:11px;
    color:var(--goldSoft); line-height:1; margin-bottom:26px;
  }
  .tagline {
    font-family:'Cormorant',Georgia,serif; font-style:italic; font-weight:400;
    font-size:31px; line-height:1.32; color:var(--text); margin-bottom:22px;
  }
  .rule { width:64px; height:1px; background:rgba(194,168,120,.4); margin-bottom:20px; }
  .features {
    font-family:'Jost',sans-serif; font-weight:300; font-size:17px; letter-spacing:1px;
    color:var(--dim); line-height:1.5;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="glow"></div>
    <div class="orb-wrap">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="flower">
        <div class="petal" style="transform:rotate(30deg) translateY(-50px)"></div>
        <div class="petal" style="transform:rotate(90deg) translateY(-50px)"></div>
        <div class="petal" style="transform:rotate(150deg) translateY(-50px)"></div>
        <div class="petal" style="transform:rotate(210deg) translateY(-50px)"></div>
        <div class="petal" style="transform:rotate(270deg) translateY(-50px)"></div>
        <div class="petal" style="transform:rotate(330deg) translateY(-50px)"></div>
      </div>
    </div>
    <div class="text">
      <div class="omega"><svg width="64" height="64" viewBox="192 162 640 640" aria-hidden="true">
        <defs>
          <linearGradient id="fgGold" gradientUnits="userSpaceOnUse" x1="0" y1="250" x2="0" y2="760"><stop offset="0" stop-color="#f4e2b8"/><stop offset=".45" stop-color="#d4b376"/><stop offset="1" stop-color="#9a7b44"/></linearGradient>
          <radialGradient id="fgOrb" cx="42%" cy="36%" r="70%"><stop offset="0" stop-color="#f6e6c0"/><stop offset=".45" stop-color="#cfae6c"/><stop offset="1" stop-color="#6e5530"/></radialGradient>
          <radialGradient id="fgGlow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#e2b874" stop-opacity=".45"/><stop offset="1" stop-color="#e2b874" stop-opacity="0"/></radialGradient>
        </defs>
        <circle cx="512" cy="477" r="292" fill="none" stroke="#d4b376" stroke-opacity=".13" stroke-width="5"/>
        <circle cx="512" cy="477" r="200" fill="url(#fgGlow)"/>
        <circle cx="512" cy="477" r="128" fill="url(#fgOrb)"/>
        <path d="M296 688 H415 A232 232 0 1 1 609 688 H728" fill="none" stroke="url(#fgGold)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
      </svg></div>
      <div class="word">STOIKOS</div>
      <div class="tagline" id="tagline"></div>
      <div class="rule"></div>
      <div class="features" id="features"></div>
    </div>
  </div>
</body>
</html>
