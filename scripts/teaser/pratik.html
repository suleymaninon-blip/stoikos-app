     Çekim: TEASER_TPL=scripts/teaser/pratik.html TEASER_MS=60000 TEASER_NAME=pratik-sessiz node scripts/teaser/render-teaser.js tr,en <çıkış>

<script>
const W = 1080, H = 1920, PI = Math.PI, CX = 540;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

const T = {
  tr: {
    o1: 'Felsefe okunmaz.', o2: 'Yaşanır.', oTag: 'GÜNLÜK PRATİK',
    mCap1: 'Sabah: üç kısa egzersiz.\nGüne niyetle başla.', mCap2: 'Tek dokunuş.\nİki dakika.',

    kTag: 'GÜNÜN KAVRAMI', kTitle: 'Kontrol Dairesi', kCap: 'Her gün bir kavram.\nBir dakikada okunur.',
    kIn: 'ELİMDE', kOut: 'ELİMDE DEĞİL', inW: ['tepkilerim', 'kararlarım', 'niyetim'], outW: ['hava', 'trafik', 'başkaları', 'geçmiş', 'şans'], more: 'Devamını oku  →',
    eTag: 'AKŞAM  ·  GÜNÜ KAPATIRKEN', eCap1: 'Akşam: günü sakince kapat.', eCap2: 'Bir soru.\nBirkaç satır.',
    eRows: [['Günün Muhasebesi', '5 dk'], ['Stoacı Şükran', '3 dk']],

    jText: 'Toplantıda sesim yükseldi. Altında "beni dinlemiyorlar" vardı. Yarın önce soracağım.',
    save: 'Kaydet', saved: 'Yansıman kaydedildi', local: 'Yalnız telefonunda kalır.',
    pCap: 'Küçük adımlar.\nHer gün.', allDone: '✦  Tüm pratikler tamamlandı', week: ['P', 'S', 'Ç', 'P', 'C', 'C', 'P'],
    tag: 'Her gün, biraz daha sakin.', sub: 'SABAH  ·  KAVRAM  ·  AKŞAM', cta: 'Ücretsiz başla · stoikos.app',
  },
  en: {
    o1: 'Philosophy is not read.', o2: 'It is lived.', oTag: 'DAILY PRACTICE',
    mCap1: 'Morning: three short exercises.\nBegin the day with intention.', mCap2: 'One tap.\nTwo minutes.',
    mTag: 'MORNING  ·  STARTING THE DAY',
    rows: [['Negative Visualization', '3 min'], ['Morning Intention', '2 min'], ['Memento Mori', '2 min']],
    sheetDesc: 'Today the only things in my control are my responses and choices. All else is not mine.',
    doneBtn: '✓  Mark as done', toast: 'Negative Visualization done', undo: 'Undo',
    journey: 'TODAY\'S JOURNEY',
    kTag: 'CONCEPT OF THE DAY', kTitle: 'Dichotomy of Control', kCap: 'One concept a day.\nA one-minute read.',
    kIn: 'IN MY CONTROL', kOut: 'NOT IN MY CONTROL', inW: ['my responses', 'my choices', 'my intent'], outW: ['weather', 'traffic', 'other people', 'the past', 'luck'], more: 'Read more  →',
    eTag: 'EVENING  ·  CLOSING THE DAY', eCap1: 'Evening: close the day calmly.', eCap2: 'One question.\nA few lines.',
    eRows: [['Review of the Day', '5 min'], ['Stoic Gratitude', '3 min']],
    jTag: 'DAILY REFLECTION', jQ: 'Did anything anger you today? What was the sentence underneath it?',
    jText: 'I raised my voice in the meeting. Underneath was "they are not listening". Tomorrow I will ask first.',
    save: 'Save', saved: 'Your reflection is saved', local: 'It stays only on your phone.',
    pCap: 'Small steps.\nEvery day.', allDone: '✦  All practices complete', week: ['M', 'T', 'W', 'T', 'F', 'S', 'S'],
    tag: 'A little calmer, every day.', sub: 'MORNING  ·  CONCEPT  ·  EVENING', cta: 'Start free · stoikos.app',
  },
};
let L = T.tr;

// ── yardımcılar ─────────────────────────────────────────────
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = (x) => { x = clamp(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; };
const out = (x) => 1 - Math.pow(1 - clamp(x), 3);
const win = (t, a, b, fi = 600, fo = 600) => clamp((t - a) / fi) * (1 - clamp((t - (b - fo)) / fo));
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) | 0; let x = Math.imul(s ^ (s >>> 15), 1 | s);
  x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
const hex = (c) => c[0] === '#' ? [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)) : c.match(/\d+/g).slice(0, 3).map(Number);
const mixA = (c1, c2, k) => { const a = hex(c1), b = hex(c2); return a.map((v, i) => Math.round(lerp(v, b[i], clamp(k)))); };
const mix = (c1, c2, k) => `rgb(${mixA(c1, c2, k).join(',')})`;
const rgba = (arr, a) => `rgba(${arr.join(',')},${a})`;

// Sahne sınırları (ms)
const S = { M: 5000, K: 19000, E: 29000, P: 44000, END: 53000 };

// Tema: gündüz (Ege) → gece (Gece mavisi). night(t) 0..1
const night = (t) => ease((t - 29200) / 3200);
const dawn = (t) => 1 - ease(t / 6500);
function TH(t) { const n = night(t);
  return { n,
    card: mix('#FFFFFF', '#1D2938', n), card2: mix('#F3EFE6', '#223042', n), ink: mix('#1D2A2F', '#EAF0F6', n), ink2: mix('#3E4F55', '#C4D0DC', n),
    muted: mix('#5B6A70', '#9AA9BA', n), acc: mix('#2B7476', '#86BDD0', n), accA: mixA('#2B7476', '#86BDD0', n), line: mix('#E2DCCF', '#2C3B4F', n),
    onAcc: mix('#FFFFFF', '#0F1824', n), cap: mix('#1D2A2F', '#F3ECDF', n) };
}
function sky(t) {
  const n = night(t), d = dawn(t);
  const top = mix(mix('#F5F1E8', '#F3C9A0', d * .9), '#0b111b', n), mid = mix(mix('#F5F1E8', '#F8E3C8', d), '#141d2a', n), bot = mix(mix('#EFEADF', '#FBF1E2', d), '#1f2c40', n);
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, top); g.addColorStop(.5, mid); g.addColorStop(1, bot); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // yıldızlar (gece)
  if (n > 0) { const r = rng(5); for (let i = 0; i < 80; i++) { const x = r() * W, y = r() * H * .85, s = .6 + r() * 1.8, p = r() * 6.28;
    ctx.fillStyle = `rgba(220,226,240,${n * (.2 + .35 * (.5 + .5 * Math.sin(t / 900 + p)))})`; ctx.beginPath(); ctx.arc(x, y, s, 0, 2 * PI); ctx.fill(); } }
  // güneş: 0–31 sn yay; ay: 31–53 sn
  const su = clamp(t / 31000), sx = lerp(120, 960, su), sy = 250 - Math.sin(PI * su) * 130, sa = Math.min(1, Math.sin(PI * su) * 4) * (1 - n);
  if (sa > 0) { glow(sx, sy, 190, '255,196,120', .5 * sa); glow(sx, sy, 80, '255,224,170', .9 * sa);
    ctx.fillStyle = `rgba(255,236,196,${sa})`; ctx.beginPath(); ctx.arc(sx, sy, 40, 0, 2 * PI); ctx.fill(); }
  const mu = clamp((t - 31000) / 26000), mx = lerp(160, 900, mu), my = 240 - Math.sin(PI * mu) * 110, ma = Math.min(1, Math.sin(PI * mu) * 5) * n * (1 - ease((t - 52400) / 600));
  if (ma > 0) { glow(mx, my, 150, '185,180,224', .35 * ma);
    ctx.fillStyle = `rgba(232,236,246,${ma})`; ctx.beginPath(); ctx.arc(mx, my, 34, 0, 2 * PI); ctx.fill();
    ctx.fillStyle = mix('#0b111b', '#141d2a', .3); ctx.globalAlpha = ma; ctx.beginPath(); ctx.arc(mx + 15, my - 9, 29, 0, 2 * PI); ctx.fill(); ctx.globalAlpha = 1; }
}
function glow(x, y, r, color, a) { if (a <= 0) return; const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${color},${a})`); g.addColorStop(1, `rgba(${color},0)`); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r); }
function caption(text, a, y, size, th) {
  if (a <= 0 || !text) return; const lines = text.split('\n');
  ctx.save(); ctx.globalAlpha = clamp(a); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `italic 400 ${size}px Cormorant`; ctx.fillStyle = th.cap;
  lines.forEach((ln, i) => ctx.fillText(ln, CX, y + i * size * 1.15 + (1 - out(a)) * 20)); ctx.restore();
}
function label(text, a, y, th, size = 28, color = null, x = CX, align = 'center', sp = 6) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = clamp(a); ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.font = `500 ${size}px Jost`; ctx.letterSpacing = `${sp}px`; ctx.fillStyle = color || th.acc; ctx.fillText(text, x + (align === 'center' ? sp / 2 : 0), y); ctx.restore();
}
function wrap(text, maxW) { const words = text.split(' '), lines = []; let cur = '';
  for (const w of words) { const tryL = cur ? cur + ' ' + w : w; if (ctx.measureText(tryL).width > maxW && cur) { lines.push(cur); cur = w; } else cur = tryL; }
  if (cur) lines.push(cur); return lines; }
function card(x, y, w, h, th, a = 1, r = 34, stroke = true) {
  ctx.save(); ctx.globalAlpha *= a; ctx.shadowColor = `rgba(20,30,40,${.10 * (1 - th.n)})`; ctx.shadowBlur = 30; ctx.shadowOffsetY = 8;
  ctx.fillStyle = th.card; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); ctx.shadowColor = 'transparent';
  if (stroke) { ctx.strokeStyle = th.line; ctx.lineWidth = 2; ctx.stroke(); } ctx.restore();
}
// Kare onay kutusu; k: 0 boş → 1 işaretli (onay çizilir)
function checkbox(x, y, s, k, th) {
  ctx.save(); const r = s * .27, pop = 1 + .14 * Math.sin(clamp(k) * PI);
  ctx.translate(x + s / 2, y + s / 2); ctx.scale(pop, pop); ctx.translate(-s / 2, -s / 2);
  ctx.beginPath(); ctx.roundRect(0, 0, s, s, r);
  ctx.fillStyle = rgba(th.accA, clamp(k * 2)); ctx.fill(); ctx.strokeStyle = k > .05 ? th.acc : th.muted; ctx.lineWidth = 3; ctx.stroke();
  if (k > .3) { const p = [[s * .24, s * .52], [s * .43, s * .7], [s * .77, s * .31]], L1 = Math.hypot(p[1][0] - p[0][0], p[1][1] - p[0][1]), L2 = Math.hypot(p[2][0] - p[1][0], p[2][1] - p[1][1]);
    ctx.strokeStyle = th.onAcc; ctx.lineWidth = s * .12; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.setLineDash([L1 + L2, L1 + L2]); ctx.lineDashOffset = (L1 + L2) * (1 - ease((k - .3) / .7));
    ctx.beginPath(); ctx.moveTo(...p[0]); ctx.lineTo(...p[1]); ctx.lineTo(...p[2]); ctx.stroke(); ctx.setLineDash([]); }
  ctx.restore();
}
function row(y, name, dur, k, a, th, slide = 0) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.translate(slide, 0);
  card(100, y, 880, 124, th);
  checkbox(136, y + 34, 56, k, th);
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.font = '500 40px Jost'; ctx.fillStyle = k > .6 ? th.muted : th.ink; ctx.fillText(name, 226, y + 62);
  if (k > .6) { const w = ctx.measureText(name).width; ctx.strokeStyle = th.muted; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(226, y + 64); ctx.lineTo(226 + w * ease((k - .6) / .4), y + 64); ctx.stroke(); }
  ctx.textAlign = 'right'; ctx.font = '400 32px Jost'; ctx.fillStyle = th.muted; ctx.fillText(dur, 944, y + 62);
  ctx.restore();
}
function ring(cx, cy, R, frac, txt, th, a = 1, lw = 18) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a;
  ctx.strokeStyle = rgba(th.accA, .16); ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 2 * PI); ctx.stroke();
  ctx.strokeStyle = th.acc; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(cx, cy, R, -PI / 2, -PI / 2 + 2 * PI * clamp(frac, .0001, 1)); ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `500 ${R * .62}px CormorantR`; ctx.fillStyle = th.ink; ctx.fillText(txt, cx, cy + R * .04);
  ctx.restore();
}
function finger(x, y, press, a) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a;
  const r = 38 - 8 * press; ctx.fillStyle = 'rgba(120,130,140,.28)'; ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * PI); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 4; ctx.stroke();
  if (press > 0) { ctx.strokeStyle = `rgba(120,130,140,${.5 * (1 - press)})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, 40 + 50 * press, 0, 2 * PI); ctx.stroke(); }
  ctx.restore();
}
// parmağın yolu: [t, x, y] anahtar kareleri arasında yumuşak geçiş
function path(t, keys) { if (t <= keys[0][0]) return keys[0]; for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) { const k = ease((t - keys[i - 1][0]) / (keys[i][0] - keys[i - 1][0])); return [t, lerp(keys[i - 1][1], keys[i][1], k), lerp(keys[i - 1][2], keys[i][2], k)]; } return keys[keys.length - 1]; }
const tap = (t, at) => { const u = (t - at) / 420; return u > 0 && u < 1 ? u : 0; };
function goldOrb(x, y, r, a, check = 0) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a;
  glow(x, y, r * 2.6, '212,179,118', .35);
  const g = ctx.createRadialGradient(x - r * .3, y - r * .35, 0, x, y, r * 1.3); g.addColorStop(0, '#f8ebc8'); g.addColorStop(.45, '#d2b06c'); g.addColorStop(1, '#7a5c2e');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * PI); ctx.fill();
  if (check > 0) { ctx.strokeStyle = '#1a1610'; ctx.lineWidth = r * .16; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const p = [[x - r * .42, y + r * .02], [x - r * .1, y + r * .32], [x + r * .45, y - r * .3]];
    const L1 = Math.hypot(p[1][0] - p[0][0], p[1][1] - p[0][1]), L2 = Math.hypot(p[2][0] - p[1][0], p[2][1] - p[1][1]);
    ctx.setLineDash([L1 + L2, L1 + L2]); ctx.lineDashOffset = (L1 + L2) * (1 - ease(check));
    ctx.beginPath(); ctx.moveTo(...p[0]); ctx.lineTo(...p[1]); ctx.lineTo(...p[2]); ctx.stroke(); ctx.setLineDash([]); }
  ctx.restore();
}

// ── Sahne 0: şafak ──────────────────────────────────────────
function scene0(t) {
  const th = TH(t);
  caption(L.o1, win(t, 700, 3300, 700, 500), 820, 96, th);
  caption(L.o2, win(t, 2900, 5000, 700, 500), 820, 120, th);
  label(L.oTag, win(t, 3300, 5000, 700, 500), 1010, th, 32, null, CX, 'center', 9);
}

// ── Sahne M: sabah ──────────────────────────────────────────
const MY = [650, 800, 950];
function sceneM(t) {
  const th = TH(t), fade = 1 - ease((t - (S.K - 600)) / 600);
  caption(L.mCap1, win(t, S.M + 200, 12600, 600, 500), 380, 62, th);
  caption(L.mCap2, win(t, 12800, S.K - 300, 600, 500), 380, 74, th);
  ctx.save(); ctx.globalAlpha = fade;
  label(L.mTag, clamp((t - S.M - 200) / 500), 580, th);
  // onay durumları: satır 2 → 11,9 sn (pencereden), satır 1 → 13,6 sn, satır 3 → 15,6 sn
  const k = [clamp((t - 13600) / 700), clamp((t - 11900) / 700), clamp((t - 15600) / 700)];
  L.rows.forEach(([n, d], i) => { const a = out((t - S.M - 400 - i * 280) / 600); row(MY[i], n, d, k[i], a, th, (1 - a) * 60); });
  // bugünkü yolculuk halkası
  const done = k.reduce((s, v) => s + (v > .5 ? 1 : 0), 0), fr = (k[0] + k[1] + k[2]) / 5;
  const ra = out((t - S.M - 1400) / 700);
  ring(CX, 1330, 120, fr, `${done}/5`, th, ra);
  label(L.journey, ra, 1510, th, 26, th.muted);
  // açıklama penceresi (8,0 → 11,9 sn)
  const sh = ease((t - 8000) / 600) * (1 - ease((t - 11700) / 500));
  if (sh > 0) { const y0 = lerp(H + 20, 1030, sh);
    ctx.fillStyle = `rgba(20,30,40,${.28 * sh})`; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.fillStyle = mix('#F5F1E8', '#141d2a', th.n); ctx.beginPath(); ctx.roundRect(0, y0, W, H - y0 + 60, 56); ctx.fill();
    ctx.fillStyle = th.line; ctx.beginPath(); ctx.roundRect(CX - 50, y0 + 22, 100, 8, 4); ctx.fill();
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    label(L.mTag.split('  ·  ')[0] + '  ·  ' + L.rows[1][1], 1, y0 + 100, th, 26, null, 100, 'left');
    ctx.font = '500 76px CormorantR'; ctx.fillStyle = th.ink; ctx.fillText(L.rows[1][0], 100, y0 + 190);
    ctx.font = '400 42px Jost'; ctx.fillStyle = th.ink2; wrap(L.sheetDesc, 880).forEach((ln, i) => ctx.fillText(ln, 100, y0 + 300 + i * 62));
    const press = tap(t, 11300); ctx.fillStyle = th.acc; ctx.globalAlpha = 1 - .15 * Math.sin(press * PI);
    ctx.beginPath(); ctx.roundRect(100, y0 + 560, 880, 110, 55); ctx.fill(); ctx.globalAlpha = 1;
    ctx.textAlign = 'center'; ctx.font = '500 42px Jost'; ctx.fillStyle = th.onAcc; ctx.fillText(L.doneBtn, CX, y0 + 615);
    ctx.restore(); }
  // geri al şeridi (13,7 → 16,2 sn)
  const ta = win(t, 13700, 16400, 400, 400);
  if (ta > 0) { const y = 1660 + (1 - ta) * 60; ctx.save(); ctx.globalAlpha = ta * fade;
    ctx.fillStyle = mix('#1D2A2F', '#EAF0F6', th.n); ctx.beginPath(); ctx.roundRect(100, y, 880, 100, 50); ctx.fill();
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.font = '400 34px Jost'; ctx.fillStyle = mix('#FFFFFF', '#0F1824', th.n); ctx.fillText(L.toast, 146, y + 50);
    ctx.textAlign = 'right'; ctx.font = '500 34px Jost'; ctx.fillStyle = mix('#9FD3CF', '#2B7476', th.n); ctx.fillText(L.undo, 934, y + 50); ctx.restore(); }
  ctx.restore();
  // parmak
  const p = path(t, [[6800, 900, 1500], [7500, 600, MY[1] + 62], [8300, 600, MY[1] + 62], [10600, 760, 1500], [11300, 540, 1645], [12300, 540, 1645], [13400, 164, MY[0] + 62], [14400, 164, MY[0] + 62], [15400, 164, MY[2] + 62], [16600, 164, MY[2] + 62], [17400, 500, 1500]]);
  const pr = tap(t, 7600) || tap(t, 11300) || tap(t, 13500) || tap(t, 15500);
  finger(p[1], p[2], pr, win(t, 6800, 17400, 400, 500) * fade);
}

// ── Sahne K: günün kavramı ──────────────────────────────────
let kWords = [];
