const T = {

  },
};
let L = T.tr;

// ── yardımcılar ─────────────────────────────────────────────
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = (x) => { x = clamp(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; };
const out = (x) => 1 - Math.pow(1 - clamp(x), 3);
const win = (t, a, b, fi = 600, fo = 600) => clamp((t - a) / fi) * (1 - clamp((t - (b - fo)) / fo));
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) | 0; let x = Math.imul(s ^ (s >>> 15), 1 | s);
  x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
const hex = (c) => c[0] === '#' ? [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)) : c.match(/\d+/g).slice(0, 3).map(Number);
const mixA = (c1, c2, k) => { const a = hex(c1), b = hex(c2); return a.map((v, i) => Math.round(lerp(v, b[i], clamp(k)))); };
const mix = (c1, c2, k) => `rgb(${mixA(c1, c2, k).join(',')})`;
const rgba = (arr, a) => `rgba(${arr.join(',')},${a})`;

const sine = (x) => .5 - .5 * Math.cos(PI * clamp(x));

// Sahne sınırları (ms)
const S = { CHAT: 6000, MEM: 36000, TRUST: 44000, END: 52500 };
const night = () => 1;
const dawnUp = (t) => ease((t - 43500) / 9000);
function TH(t) { const n = night(t);
  return { n,
    card: mix('#FFFFFF', '#1D2938', n), card2: mix('#F3EFE6', '#223042', n), ink: mix('#1D2A2F', '#EAF0F6', n), ink2: mix('#3E4F55', '#C4D0DC', n),
    muted: mix('#5B6A70', '#9AA9BA', n), acc: mix('#2B7476', '#86BDD0', n), accA: mixA('#2B7476', '#86BDD0', n), line: mix('#E2DCCF', '#2C3B4F', n),
    onAcc: mix('#FFFFFF', '#0F1824', n), cap: mix('#1D2A2F', '#F3ECDF', n) };
}

function sky(t) {
  const d = dawnUp(t);
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0b111b'); g.addColorStop(.55, mix('#141d2a', '#1c2636', d)); g.addColorStop(1, mix('#1f2c40', '#6b4a3a', d * .8)); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (d > 0) { const hg = ctx.createRadialGradient(CX, H + 200, 0, CX, H + 200, 1100); hg.addColorStop(0, `rgba(255,190,120,${.55 * d})`); hg.addColorStop(.5, `rgba(240,150,100,${.2 * d})`); hg.addColorStop(1, 'rgba(240,150,100,0)'); ctx.fillStyle = hg; ctx.fillRect(0, 0, W, H); }
  const r = rng(5); for (let i = 0; i < 80; i++) { const x = r() * W, y = r() * H * .85, s = .6 + r() * 1.8, p = r() * 6.28;
    ctx.fillStyle = `rgba(220,226,240,${(1 - .6 * d) * (.2 + .35 * (.5 + .5 * Math.sin(t / 900 + p)))})`; ctx.beginPath(); ctx.arc(x, y, s, 0, 2 * PI); ctx.fill(); }
}
function glow(x, y, r, color, a) { if (a <= 0) return; const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${color},${a})`); g.addColorStop(1, `rgba(${color},0)`); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r); }
function caption(text, a, y, size, th) {
  if (a <= 0 || !text) return; const lines = text.split('\n');
  ctx.save(); ctx.globalAlpha = clamp(a); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `italic 400 ${size}px Cormorant`; ctx.fillStyle = th.cap;
  lines.forEach((ln, i) => ctx.fillText(ln, CX, y + i * size * 1.15 + (1 - out(a)) * 20)); ctx.restore();
}
function label(text, a, y, th, size = 28, color = null, x = CX, align = 'center', sp = 6) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = clamp(a); ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.font = `500 ${size}px Jost`; ctx.letterSpacing = `${sp}px`; ctx.fillStyle = color || th.acc; ctx.fillText(text, x + (align === 'center' ? sp / 2 : 0), y); ctx.restore();
}
function wrap(text, maxW) { const words = text.split(' '), lines = []; let cur = '';
  for (const w of words) { const tryL = cur ? cur + ' ' + w : w; if (ctx.measureText(tryL).width > maxW && cur) { lines.push(cur); cur = w; } else cur = tryL; }
  if (cur) lines.push(cur); return lines; }
function card(x, y, w, h, th, a = 1, r = 34, stroke = true) {
  ctx.save(); ctx.globalAlpha *= a; ctx.shadowColor = `rgba(20,30,40,${.10 * (1 - th.n)})`; ctx.shadowBlur = 30; ctx.shadowOffsetY = 8;
  ctx.fillStyle = th.card; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); ctx.shadowColor = 'transparent';
  if (stroke) { ctx.strokeStyle = th.line; ctx.lineWidth = 2; ctx.stroke(); } ctx.restore();
}
// Kare onay kutusu; k: 0 boş → 1 işaretli (onay çizilir)
function checkbox(x, y, s, k, th) {
  ctx.save(); const r = s * .27, pop = 1 + .14 * Math.sin(clamp(k) * PI);
  ctx.translate(x + s / 2, y + s / 2); ctx.scale(pop, pop); ctx.translate(-s / 2, -s / 2);
  ctx.beginPath(); ctx.roundRect(0, 0, s, s, r);
  ctx.fillStyle = rgba(th.accA, clamp(k * 2)); ctx.fill(); ctx.strokeStyle = k > .05 ? th.acc : th.muted; ctx.lineWidth = 3; ctx.stroke();
  if (k > .3) { const p = [[s * .24, s * .52], [s * .43, s * .7], [s * .77, s * .31]], L1 = Math.hypot(p[1][0] - p[0][0], p[1][1] - p[0][1]), L2 = Math.hypot(p[2][0] - p[1][0], p[2][1] - p[1][1]);
    ctx.strokeStyle = th.onAcc; ctx.lineWidth = s * .12; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.setLineDash([L1 + L2, L1 + L2]); ctx.lineDashOffset = (L1 + L2) * (1 - ease((k - .3) / .7));
    ctx.beginPath(); ctx.moveTo(...p[0]); ctx.lineTo(...p[1]); ctx.lineTo(...p[2]); ctx.stroke(); ctx.setLineDash([]); }
  ctx.restore();
}
function row(y, name, dur, k, a, th, slide = 0) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.translate(slide, 0);
  card(100, y, 880, 124, th);
  checkbox(136, y + 34, 56, k, th);
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.font = '500 40px Jost'; ctx.fillStyle = k > .6 ? th.muted : th.ink; ctx.fillText(name, 226, y + 62);
  if (k > .6) { const w = ctx.measureText(name).width; ctx.strokeStyle = th.muted; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(226, y + 64); ctx.lineTo(226 + w * ease((k - .6) / .4), y + 64); ctx.stroke(); }
  ctx.textAlign = 'right'; ctx.font = '400 32px Jost'; ctx.fillStyle = th.muted; ctx.fillText(dur, 944, y + 62);
  ctx.restore();
}
function ring(cx, cy, R, frac, txt, th, a = 1, lw = 18) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a;
  ctx.strokeStyle = rgba(th.accA, .16); ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 2 * PI); ctx.stroke();
  ctx.strokeStyle = th.acc; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(cx, cy, R, -PI / 2, -PI / 2 + 2 * PI * clamp(frac, .0001, 1)); ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `500 ${R * .62}px CormorantR`; ctx.fillStyle = th.ink; ctx.fillText(txt, cx, cy + R * .04);
  ctx.restore();
}
function finger(x, y, press, a) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a;
  const r = 38 - 8 * press; ctx.fillStyle = 'rgba(120,130,140,.28)'; ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * PI); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 4; ctx.stroke();
  if (press > 0) { ctx.strokeStyle = `rgba(120,130,140,${.5 * (1 - press)})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, 40 + 50 * press, 0, 2 * PI); ctx.stroke(); }
  ctx.restore();
}
// parmağın yolu: [t, x, y] anahtar kareleri arasında yumuşak geçiş
function path(t, keys) { if (t <= keys[0][0]) return keys[0]; for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) { const k = ease((t - keys[i - 1][0]) / (keys[i][0] - keys[i - 1][0])); return [t, lerp(keys[i - 1][1], keys[i][1], k), lerp(keys[i - 1][2], keys[i][2], k)]; } return keys[keys.length - 1]; }
const tap = (t, at) => { const u = (t - at) / 420; return u > 0 && u < 1 ? u : 0; };
function goldOrb(x, y, r, a, check = 0) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a;
  glow(x, y, r * 2.6, '212,179,118', .35);
  const g = ctx.createRadialGradient(x - r * .3, y - r * .35, 0, x, y, r * 1.3); g.addColorStop(0, '#f8ebc8'); g.addColorStop(.45, '#d2b06c'); g.addColorStop(1, '#7a5c2e');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * PI); ctx.fill();
  if (check > 0) { ctx.strokeStyle = '#1a1610'; ctx.lineWidth = r * .16; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const p = [[x - r * .42, y + r * .02], [x - r * .1, y + r * .32], [x + r * .45, y - r * .3]];
    const L1 = Math.hypot(p[1][0] - p[0][0], p[1][1] - p[0][1]), L2 = Math.hypot(p[2][0] - p[1][0], p[2][1] - p[1][1]);
    ctx.setLineDash([L1 + L2, L1 + L2]); ctx.lineDashOffset = (L1 + L2) * (1 - ease(check));
    ctx.beginPath(); ctx.moveTo(...p[0]); ctx.lineTo(...p[1]); ctx.lineTo(...p[2]); ctx.stroke(); ctx.setLineDash([]); }
  ctx.restore();
}


const PETAL = '150,205,222';
function flower(x, y, open, size, a = 1) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a;
  const pr = size * .44 * (.5 + .5 * open), spread = size * .44 * open;
  for (let i = 0; i < 6; i++) { const ang = i / 6 * 2 * PI - PI / 2 + open * PI / 3;
    ctx.fillStyle = `rgba(${PETAL},.3)`; ctx.beginPath(); ctx.arc(x + Math.cos(ang) * spread, y + Math.sin(ang) * spread, pr, 0, 2 * PI); ctx.fill(); }
  ctx.restore();
}
function bubble(x, y, w, h, th, mine, a = 1) {
  ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = mine ? th.acc : th.card; ctx.beginPath(); ctx.roundRect(x, y, w, h, mine ? [34, 34, 8, 34] : [34, 34, 34, 8]); ctx.fill();
  if (!mine) { ctx.strokeStyle = th.line; ctx.lineWidth = 2; ctx.stroke(); } ctx.restore();
}
function quoteBlock(x, y, w, q, by, th, a = 1) {
  ctx.save(); ctx.globalAlpha *= a; ctx.font = 'italic 400 42px Cormorant'; const ls = wrap('“' + q + '”', w - 50), h = ls.length * 52 + 64;
  ctx.fillStyle = 'rgba(212,179,118,.10)'; ctx.beginPath(); ctx.roundRect(x, y, w, h, 18); ctx.fill(); ctx.fillStyle = '#d4b376'; ctx.fillRect(x, y + 10, 4, h - 20);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = th.ink; ls.forEach((ln, i) => ctx.fillText(ln, x + 28, y + 34 + i * 52));
  ctx.font = '500 24px Jost'; ctx.letterSpacing = '3px'; ctx.fillStyle = '#d4b376'; ctx.fillText(by.toLocaleUpperCase(L === T.tr ? 'tr' : 'en'), x + 28, y + h - 26); ctx.restore(); return h;
}
function qbH(w, q) { ctx.font = 'italic 400 42px Cormorant'; return wrap('“' + q + '”', w - 50).length * 52 + 64; }

// ── Sahne 0: gece, dönen düşünceler ─────────────────────────
function scene0(t) {
  const th = TH(t), fade = 1 - ease((t - 5200) / 800);
  ctx.save(); ctx.globalAlpha = clamp(t / 800) * fade;
  // karalama: rastgele yürüyen çizgi, zamanla uzar
  const r = rng(31); ctx.strokeStyle = 'rgba(154,169,186,.35)'; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.beginPath();
  let x = CX, y = 1000; const n = Math.floor(clamp(t / 4500) * 260);
  for (let i = 0; i < n; i++) { const a = r() * 2 * PI, d = 40 + r() * 90; x = clamp(x + Math.cos(a) * d, CX - 300, CX + 300); y = clamp(y + Math.sin(a) * d, 760, 1240); if (i === 0) ctx.moveTo(x, y); else ctx.quadraticCurveTo(x + (r() - .5) * 120, y + (r() - .5) * 120, x, y); }
  ctx.stroke();
  L.worries.forEach((w, i) => { const a0 = i / L.worries.length * 2 * PI, sp = (i % 2 ? 1 : -1) * (.5 + (i % 3) * .2), rad = 300 + 110 * Math.sin(t / 700 + i * 1.7), ang = a0 + t / 1000 * sp;
    const k = clamp((t - 300 - i * 220) / 500);
    ctx.globalAlpha = clamp(t / 800) * fade * k * (.5 + .4 * Math.sin(t / 500 + i)); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `italic 400 ${44 + (i % 3) * 10}px Cormorant`; ctx.fillStyle = '#c4d0dc'; ctx.fillText(w, CX + Math.cos(ang) * rad * .9, 1000 + Math.sin(ang) * rad * 1.05); });
  ctx.restore();
  caption(L.o1, win(t, 500, 3000, 600, 500), 380, 96, th);
  caption(L.o2, win(t, 2800, 5600, 600, 500), 380, 96, th);
}

// ── Sahne CHAT: sohbet (6 → 36 sn) ──────────────────────────
function sceneChat(t) {
  const th = TH(t), a = clamp((t - S.CHAT) / 700), fade = 1 - ease((t - (S.MEM - 600)) / 600);
  caption(L.cap1, win(t, S.CHAT + 300, 14400, 600, 500), 370, 70, th);
  caption(L.cap2, win(t, 14900, 20400, 600, 500), 370, 70, th);
  caption(L.cap3, win(t, 21000, S.MEM - 300, 600, 500), 400, 80, th);
  ctx.save(); ctx.globalAlpha = a * fade;
  // başlık
  goldOrb(150, 590, 38, a * fade);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.font = '500 58px CormorantR'; ctx.fillStyle = th.ink; ctx.fillText(L.title, 214, 572);
  ctx.font = '400 27px Jost'; ctx.fillStyle = th.muted; ctx.fillText(L.sub, 214, 622);
  ctx.fillStyle = '#5CC08A'; ctx.beginPath(); ctx.arc(872, 590, 8, 0, 2 * PI); ctx.fill(); ctx.font = '400 26px Jost'; ctx.fillStyle = th.muted; ctx.fillText(L.active, 890, 592);
  ctx.strokeStyle = th.line; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(100, 670); ctx.lineTo(980, 670); ctx.stroke();

  // 1) karşılama balonu + konu çipleri (6,6 → 10,6 sn)
  const wa = out((t - 6700) / 600) * (1 - ease((t - 10300) / 500));
  if (wa > 0) { ctx.save(); ctx.globalAlpha = a * fade * wa; ctx.font = '400 38px Jost'; const hl = wrap(L.hello, 660), qh = qbH(660, L.helloQ), bh = 50 + hl.length * 54 + 20 + qh + 40;
    bubble(100, 720 + (1 - wa) * 30, 740, bh, th, false); ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.font = '400 38px Jost'; ctx.fillStyle = th.ink2; hl.forEach((ln, i) => ctx.fillText(ln, 140, 778 + i * 54));
    quoteBlock(140, 720 + 50 + hl.length * 54 + 14, 660, L.helloQ, L.helloA, th);
    const cy0 = 720 + bh + 70, ca = out((t - 7700) / 600); ctx.globalAlpha = a * fade * wa * ca;

    let cx = 100, cy = cy0 + 70; ctx.font = '400 34px Jost'; L.chips.forEach((c) => { const w = ctx.measureText(c).width + 64; if (cx + w > 980) { cx = 100; cy += 100; }
      ctx.fillStyle = rgba(th.accA, .12); ctx.strokeStyle = rgba(th.accA, .35); ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(cx, cy - 40, w, 80, 40); ctx.fill(); ctx.stroke(); ctx.fillStyle = th.acc; ctx.fillText(c, cx + 32, cy); cx += w + 18; });
    ctx.restore(); }

  // 2) kullanıcı mesajı (gönderilince, 14,5 sn)
  ctx.font = '400 38px Jost'; const ml = wrap(L.msg, 560), mh = ml.length * 54 + 56, mw = Math.min(640, Math.max(...ml.map((l) => ctx.measureText(l).width)) + 80);
  const ua = out((t - 14500) / 500);
  if (ua > 0) { ctx.save(); ctx.globalAlpha = a * fade * ua; bubble(980 - mw, 720 + (1 - ua) * 40, mw, mh, th, true); ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.font = '400 38px Jost'; ctx.fillStyle = th.onAcc; ml.forEach((ln, i) => ctx.fillText(ln, 980 - mw + 40, 720 + 28 + 27 + i * 54)); ctx.restore(); }
  const ry = 720 + mh + 36;

  // 3) bekleme: nefes çiçeği (14,9 → 20,5 sn)

}

// ── Sahne MEM: hafıza ───────────────────────────────────────
function sceneMem(t) {

    ctx.font = '400 36px Jost'; const ml = wrap(L.msg, 620), mh = ml.length * 52 + 52; bubble(200, y1 + 40, 720, mh, th, true); ctx.fillStyle = th.onAcc; ml.forEach((ln, i) => ctx.fillText(ln, 240, y1 + 40 + 26 + 26 + i * 52)); }
  if (k2 > 0) { ctx.globalAlpha = a * k2; ctx.font = '500 26px Jost'; ctx.letterSpacing = '5px'; ctx.fillStyle = th.muted; ctx.fillText(L.d2, 200, y2); ctx.letterSpacing = '0px';
    ctx.font = '400 36px Jost'; const ml = wrap(L.m2, 660), mh = ml.length * 52 + 52; bubble(200, y2 + 40 + (1 - k2) * 30, 760, mh, th, false);

// ── Sahne TRUST: dürüstlük ──────────────────────────────────
function trustIcon(i, x, y, color) { ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';

// ── Sahne END: logo ─────────────────────────────────────────
