<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- "İzler" — 30 sn'lik tanıtım animasyonu (1080×1920), 23 Kasım 2026.
     Akış: yedi taşlı yol "Yürüdüğün her yol bir iz bırakır." → bir programın yedi günü dolar → sessiz mühür
     (sikke dönerek oturur, hale, ışık süzülür; ad + motif cümlesi) → İzler koleksiyonu (5/10; kazanılmamış yuvalar
     kesik çizgi, sürpriz) → üç sikke yavaşça döner "Puan yok. Sıralama yok." → logo.
     Sikkeler uygulamadaki fotoğrafların büyük kesimi: docs/sosyal-medya/izler-videosu/sikkeler/<id>.webp
     (kaynak docs/izler/kaynak). Adlar, motif cümleleri uygulamadakiyle aynı (constants/i18n.tsx trace.*).
     Çekim + ses: bash scripts/social/izler-build.sh [tr,en] -->
<style>
  @font-face { font-family:'Cinzel'; font-weight:600;
    src:url('../../node_modules/@expo-google-fonts/cinzel/Cinzel_600SemiBold.ttf') format('truetype'); }
  @font-face { font-family:'Cormorant'; font-style:italic; font-weight:400;
    src:url('../../node_modules/@expo-google-fonts/cormorant-garamond/CormorantGaramond_400Regular_Italic.ttf') format('truetype'); }
  @font-face { font-family:'CormorantR'; font-weight:500;
    src:url('../../node_modules/@expo-google-fonts/cormorant-garamond/CormorantGaramond_500Medium.ttf') format('truetype'); }
  @font-face { font-family:'Jost'; font-weight:400;
    src:url('../../node_modules/@expo-google-fonts/jost/Jost_400Regular.ttf') format('truetype'); }
  @font-face { font-family:'Jost'; font-weight:500;
    src:url('../../node_modules/@expo-google-fonts/jost/Jost_500Medium.ttf') format('truetype'); }
  * { margin:0; padding:0; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:#000; }
  canvas { display:block; }
  .pre { position:absolute; left:-999px; top:0; }
  .img { position:absolute; left:-9999px; top:0; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<span class="pre" style="font-family:Cinzel;font-weight:600">S</span>
<span class="pre" style="font-family:Cormorant;font-style:italic">S</span>
<span class="pre" style="font-family:CormorantR;font-weight:500">S</span>
<span class="pre" style="font-family:Jost;font-weight:400">S</span>
<span class="pre" style="font-family:Jost;font-weight:500">S</span>
<div id="imgs"></div>
<script>
const W = 1080, H = 1920, PI = Math.PI, CX = 540, DUR = 30000;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

const IDS = ['control', 'calm', 'anger', 'regard', 'time', 'grief', 'enough', 'work', 'patience', 'criticism'];
const EARNED = ['control', 'calm', 'anger', 'time', 'enough'];
const IMG = {};
for (const id of [...IDS, 'mortality', 'uncertainty', 'people']) {
  const im = new Image(); im.className = 'img'; im.src = `../../docs/sosyal-medya/izler-videosu/sikkeler/${id}.webp`;
  document.getElementById('imgs').appendChild(im); IMG[id] = im;
}

const T = {
  tr: {
    o1: 'Yürüdüğün her yol', o2: 'bir iz bırakır.',
    prog: 'Kontrol Dairesi', progSub: '7 günde huzurun temeli', day: 'GÜN',
    cap1: 'Yedi gün.\nYedi küçük adım.',
    seal: 'YEDİNCİ GÜN TAMAM', coin: 'Kontrol Dairesi sikkesi', motif: 'Dümen. Denizi sen seçmezsin;\ndümeni sen tutarsın.',
    gridTitle: 'İZLER', gridSub: 'Bitirdiğin her programdan bir sikke.',
    names: ['Kontrol Dairesi', 'İç Sakinlik', 'Öfkeyle Çalışmak', 'Başkalarının Gözü', 'Zamanın Kısalığı', 'Kayıpla Yaşamak', 'Az ile Yetinmek', 'İşte Stoacı Olmak', 'Sabır', 'Eleştiriyi Kaldırmak'],
    soon: 'Yakında', cap2: 'Yürümediğin yolun sikkesi\nsürpriz kalır.',
    cap3: 'Puan yok. Sıralama yok.', cap4: 'Yalnızca yürüdüğün yolun izi.',
    motifs: { calm: 'Kandil', anger: 'Gerili yay', time: 'Güneş saati' },
    tag: 'Yürüdüğün yolun izleri.', cta: 'stoikos.app',
  },
  en: {
    o1: 'Every path you walk', o2: 'leaves a trace.',
    prog: 'The Dichotomy of Control', progSub: 'The foundation of peace in 7 days', day: 'DAY',
    cap1: 'Seven days.\nSeven small steps.',
    seal: 'SEVENTH DAY COMPLETE', coin: 'The Dichotomy of Control coin', motif: 'The helm. You do not choose the sea;\nyou hold the helm.',
    gridTitle: 'TRACES', gridSub: 'One coin for every program you finish.',
    names: ['Dichotomy of Control', 'Inner Calm', 'Working With Anger', 'The Eyes of Others', 'The Shortness of Time', 'Living With Loss', 'Having Enough', 'Stoic at Work', 'Patience', 'Taking Criticism'],
    soon: 'Coming soon', cap2: 'The coin of a path not yet walked\nstays a surprise.',
    cap3: 'No points. No rankings.', cap4: 'Just the trace of the road you walked.',
    motifs: { calm: 'The lamp', anger: 'The drawn bow', time: 'The sundial' },
    tag: 'Traces of the path you walked.', cta: 'stoikos.app',
  },
};
let L = T.tr;

// ── yardımcılar ─────────────────────────────────────────────
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const out = (x) => 1 - Math.pow(1 - clamp(x), 3);
const back = (x) => { x = clamp(x); const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const win = (t, a, b, fi = 600, fo = 600) => clamp((t - a) / fi) * (1 - clamp((t - (b - fo)) / fo));
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) | 0; let x = Math.imul(s ^ (s >>> 15), 1 | s);
  x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
function glow(x, y, r, color, a) { if (a <= 0) return; const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${color},${a})`); g.addColorStop(1, `rgba(${color},0)`); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r); }

const CREAM = '#F1E6CF', GOLD = '#D4B376', GOLD2 = '#B8955A', MUTE = '#9C8F78';

function text(s, x, y, font, color, a, align = 'center', sp = 0) {
  if (a <= 0 || !s) return; ctx.save(); ctx.globalAlpha = clamp(a); ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.font = font; ctx.letterSpacing = `${sp}px`; ctx.fillStyle = color; ctx.fillText(s, x + (align === 'center' ? sp / 2 : 0), y); ctx.restore();
}
function lines(s, y, size, a, color = CREAM, lh = 1.18, rise = 22) {
  if (a <= 0) return; s.split('\n').forEach((ln, i) => text(ln, CX, y + i * size * lh + (1 - out(a)) * rise, `italic 400 ${size}px Cormorant`, color, a));
}

// ── arka plan: bronz akşam + yükselen altın toz ──
const DUST = (() => { const r = rng(11); return Array.from({ length: 90 }, () => ({ x: r() * W, y: r() * H, s: .7 + r() * 2.2, v: 10 + r() * 28, p: r() * 6.28, d: r() })); })();
function bg(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0d0b09'); g.addColorStop(.45, '#17120d'); g.addColorStop(1, '#0a0908'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // sahneye göre kayan sıcak ışık
  const ly = lerp(820, 900, Math.sin(t / 7000)); glow(CX, ly, 900, '120,84,40', .22); glow(CX, ly - 60, 420, '214,170,104', .08);
  for (const d of DUST) {
    const y = ((d.y - (t / 1000) * d.v) % H + H) % H, x = d.x + Math.sin(t / 2200 + d.p) * 14;
    const a = (.12 + .38 * d.d) * (.55 + .45 * Math.sin(t / 900 + d.p));
    ctx.fillStyle = `rgba(232,200,140,${a})`; ctx.beginPath(); ctx.arc(x, y, d.s, 0, 2 * PI); ctx.fill();
  }
}

// ── sikke: fotoğraf + gölge + ışık süzülmesi ──
function coin(id, x, y, r, a = 1, rot = 0, sheen = -1, squash = 1) {
  const im = IMG[id]; if (a <= 0 || !im || !im.complete) return;
  ctx.save(); ctx.globalAlpha = clamp(a); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(squash, 1);
  ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = r * .28; ctx.shadowOffsetY = r * .1;
  ctx.drawImage(im, -r, -r, 2 * r, 2 * r); ctx.shadowColor = 'transparent';
  if (sheen >= 0 && sheen <= 1) {   // çapraz bir ışık bandı yüzeyden geçer
    ctx.beginPath(); ctx.arc(0, 0, r * .97, 0, 2 * PI); ctx.clip(); ctx.globalCompositeOperation = 'lighter';
    const sx = lerp(-r * 1.8, r * 1.8, sheen), lg = ctx.createLinearGradient(sx - r * .5, -r, sx + r * .5, r);
    lg.addColorStop(0, 'rgba(255,230,180,0)'); lg.addColorStop(.5, 'rgba(255,232,190,.34)'); lg.addColorStop(1, 'rgba(255,230,180,0)');
    ctx.fillStyle = lg; ctx.fillRect(-r, -r, 2 * r, 2 * r);
  }
  ctx.restore();
}
function dashedSlot(x, y, r, a, shimmer = 0) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a;
  ctx.strokeStyle = `rgba(190,170,130,${.42 + .25 * shimmer})`; ctx.lineWidth = 2.4; ctx.setLineDash([9, 11]);
  ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * PI); ctx.stroke(); ctx.setLineDash([]);
  if (shimmer > 0) glow(x, y, r * 1.1, '214,180,120', .12 * shimmer);
  ctx.restore();
}

// ── 0–4,8 sn: yedi taşlı yol ──
const STONES = Array.from({ length: 7 }, (_, i) => { const k = i / 6; return { x: lerp(210, 870, k), y: 1180 - Math.sin(k * PI) * 120 - k * 220 }; });
function scene0(t) {
  const a = 1 - clamp((t - 4200) / 600);
  STONES.forEach((s, i) => {
    const k = out((t - 400 - i * 300) / 700); if (k <= 0) return;
    ctx.save(); ctx.globalAlpha = k * a; glow(s.x, s.y, 70, '214,170,104', .35 * k);
    const g = ctx.createRadialGradient(s.x - 10, s.y - 8, 2, s.x, s.y, 40); g.addColorStop(0, '#e9d3a3'); g.addColorStop(1, '#7c6038');
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(s.x, s.y + (1 - k) * 16, 34, 20, -.15, 0, 2 * PI); ctx.fill(); ctx.restore();
  });
  // son taşın üstünde ilk parıltı: bir sikkenin habercisi
  const sp = win(t, 2600, 4600, 400, 700); if (sp > 0) { const s = STONES[6]; glow(s.x, s.y - 4, 140, '255,220,160', .5 * sp); }
  lines(L.o1, 520, 88, win(t, 900, 4700, 800, 500));
  lines(L.o2, 625, 88, win(t, 1500, 4700, 800, 500), GOLD);
}

// ── 4,6–10,6 sn: bir programın yedi günü dolar ──
function scene1(t) {
  const a = win(t, 4600, 10600, 600, 500);
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  // program kartı
  const y0 = 760 + (1 - out((t - 4600) / 700)) * 40;
  ctx.fillStyle = 'rgba(255,248,232,.06)'; ctx.strokeStyle = 'rgba(214,179,118,.35)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(90, y0, 900, 400, 40); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(80,160,120,.22)'; ctx.beginPath(); ctx.roundRect(140, y0 + 50, 96, 96, 28); ctx.fill();
  text('◎', 188, y0 + 99, '400 50px Jost', '#8fd0ae', 1);
  text(L.prog, 270, y0 + 82, '500 54px CormorantR', CREAM, 1, 'left');
  text(L.progSub, 270, y0 + 132, '400 30px Jost', MUTE, 1, 'left');
  // yedi gün
  for (let i = 0; i < 7; i++) {
    const at = 5600 + i * 520 - Math.min(i, 5) * 40, k = ease((t - at) / 360);
    const x = 170 + i * 123, y = y0 + 280;
    ctx.beginPath(); ctx.arc(x, y, 44, 0, 2 * PI);
    ctx.fillStyle = k > 0 ? `rgba(80,160,120,${.25 + .55 * k})` : 'rgba(255,255,255,.04)'; ctx.fill();
    ctx.strokeStyle = k > 0 ? `rgba(143,208,174,${.5 + .5 * k})` : 'rgba(214,179,118,.3)'; ctx.lineWidth = 2.5; ctx.stroke();
    if (k > .2) { ctx.save(); ctx.strokeStyle = '#0f1a14'; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      const p = [[x - 15, y + 1], [x - 4, y + 13], [x + 17, y - 11]], Lt = 50; ctx.setLineDash([Lt, Lt]); ctx.lineDashOffset = Lt * (1 - ease((k - .2) / .8));
      ctx.beginPath(); ctx.moveTo(...p[0]); ctx.lineTo(...p[1]); ctx.lineTo(...p[2]); ctx.stroke(); ctx.restore(); }
    else text(String(i + 1), x, y + 2, '500 34px Jost', MUTE, 1);
    if (k > 0 && k < 1) glow(x, y, 90, '143,208,174', .3 * Math.sin(k * PI));
  }
  text(`${L.day} ${Math.min(7, Math.max(1, Math.floor((t - 5600) / 480) + 1))}/7`, 940, y0 + 82, '500 28px Jost', GOLD, clamp((t - 5400) / 400), 'right', 3);
  ctx.restore();
  lines(L.cap1, 470, 78, win(t, 5000, 10300, 700, 500));
  // yedinci gün: ışık patlaması
  const fl = win(t, 9200, 10700, 250, 1100); if (fl > 0) glow(CX, 1040, 700, '255,224,170', .55 * fl);
}

// ── 10,2–17,6 sn: sessiz mühür ──
function scene2(t) {
  const a = win(t, 10200, 17600, 500, 700); if (a <= 0) return;
  const k = (t - 10500) / 1300, cy = 900;
  text(L.seal, CX, 470, '500 30px Jost', GOLD, a * out((t - 10400) / 600), 'center', 7);
  // hale halkaları
  for (let i = 0; i < 3; i++) { const u = clamp((t - 11000 - i * 380) / 1700); if (u <= 0 || u >= 1) continue;
    ctx.save(); ctx.globalAlpha = a * (1 - u) * .7; ctx.strokeStyle = 'rgba(214,179,118,.9)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(CX, cy, 250 + u * 260, 0, 2 * PI); ctx.stroke(); ctx.restore(); }
  glow(CX, cy, 520, '214,170,104', .28 * a * clamp((t - 10800) / 800));
  const sc = lerp(.6, 1, back(k)), rot = lerp(-.35, 0, out(k)), rise = (1 - out(k)) * 220;
  // sikke yerine otururken hafifçe yan döner (kenarı görünür)
  const turn = Math.cos(clamp(k) * PI * 1.0) * .5 + .5, squash = lerp(1, .18, turn * (1 - clamp(k * 1.2)));
  coin('control', CX, cy + rise, 250 * sc, a * clamp(k * 2.2), rot, (t - 12600) / 1400, Math.max(.18, squash));
  // ikinci, yavaş ışık geçişi
  if (t > 15200) coin('control', CX, cy, 250, 0, 0, -1);
  const s2 = (t - 15200) / 1600; if (s2 > 0 && s2 < 1) coin('control', CX, cy, 250, a, 0, s2);
  text(L.coin, CX, 1290, '500 64px CormorantR', CREAM, a * out((t - 12800) / 800));
  lines(L.motif, 1385, 50, a * out((t - 13500) / 900), GOLD, 1.25, 14);
}

// ── 17,2–24,6 sn: İzler koleksiyonu ──
function gridPos(i) { const c = i % 3, r = Math.floor(i / 3); return { x: 230 + c * 310, y: 680 + r * 262 }; }
function scene3(t) {
  const a = win(t, 17200, 24700, 600, 700); if (a <= 0) return;
  const earnedN = EARNED.filter((id, j) => t > 17900 + j * 620 + 200).length;
  text(L.gridTitle, 120, 430, '500 32px Jost', GOLD, a, 'left', 7);
  text(`${earnedN} / 10`, 960, 430, '500 32px Jost', MUTE, a, 'right', 2);
  ctx.save(); ctx.globalAlpha = a * .5; ctx.fillStyle = GOLD; ctx.fillRect(120 + 180, 429, 960 - 120 - 180 - 130, 1.5); ctx.restore();
  text(L.gridSub, 120, 490, '400 32px Jost', '#CBBEA4', a, 'left');
  const all = [...IDS, 'soon', 'soon'];
  all.forEach((id, i) => {
    const { x, y } = gridPos(i), j = EARNED.indexOf(id), slotA = a * out((t - 17300 - i * 45) / 600);
    const label = id === 'soon' ? L.soon : L.names[i];
    if (j >= 0) {
      const at = 17900 + j * 620, k = (t - at) / 650;
      if (k < 0) dashedSlot(x, y, 98, slotA);
      else {
        const drop = (1 - back(k)) * -160, sc = lerp(.5, 1, back(k));
        if (k < 1) glow(x, y, 220, '255,214,150', .45 * Math.sin(clamp(k) * PI) * a);
        coin(id, x, y + drop, 98 * sc, a * clamp(k * 2.5), 0, (t - at - 650) / 900);
      }
      text(label, x, y + 142, '500 26px Jost', CREAM, slotA * clamp(k + .4), 'center');
    } else {
      const sh = .5 + .5 * Math.sin(t / 520 + i * 1.3);
      if (id === 'soon') { ctx.save(); ctx.globalAlpha = slotA; ctx.strokeStyle = 'rgba(190,170,130,.35)'; ctx.lineWidth = 3; ctx.setLineDash([2, 12]); ctx.lineCap = 'round';
        ctx.beginPath(); ctx.arc(x, y, 98, 0, 2 * PI); ctx.stroke(); ctx.restore(); }
      else dashedSlot(x, y, 98, slotA, t > 21600 ? sh * win(t, 21600, 24600, 500, 500) : 0);
      text(label, x, y + 142, '400 26px Jost', '#8C8070', slotA, 'center');
    }
  });
  lines(L.cap2, 1760, 58, win(t, 21300, 24500, 700, 500), CREAM, 1.2, 14);
}

// ── 24,2–27,4 sn: üç sikke yavaşça döner ──
function scene4(t) {
  const a = win(t, 24200, 27500, 600, 600); if (a <= 0) return;
  const ids = ['calm', 'anger', 'time'], base = (t - 24200) / 3200 * PI * .5;
  const items = ids.map((id, i) => { const ang = base + i * (2 * PI / 3); return { id, i, x: CX + Math.sin(ang) * 300, z: Math.cos(ang) }; })
    .sort((p, q) => p.z - q.z);
  glow(CX, 900, 560, '214,170,104', .2 * a);
  for (const it of items) { const s = lerp(.62, 1.05, (it.z + 1) / 2);
    coin(it.id, it.x, 900 + it.z * 70, 175 * s, a * lerp(.45, 1, (it.z + 1) / 2), 0, it.z > .6 ? (t - 24800) / 1800 : -1); }
  lines(L.cap3, 1330, 72, win(t, 24500, 27400, 600, 500));
  lines(L.cap4, 1440, 56, win(t, 25300, 27400, 700, 500), GOLD);
}

// ── 27–30 sn: logo ──
const ARC = new Path2D('M296 688 H415 A232 232 0 1 1 609 688 H728');
function sceneEnd(t) {
  const T0 = 27000; if (t < T0) return;
  const m = out((t - T0) / 700), sc = .44 * (.9 + .1 * m);
  ctx.save(); ctx.translate(540, 760); ctx.scale(sc, sc); ctx.translate(-512, -477); ctx.globalAlpha = m;
  glow(512, 477, 330, '226,184,116', .4);
  const og = ctx.createRadialGradient(492, 441, 0, 512, 477, 179); og.addColorStop(0, '#f6e6c0'); og.addColorStop(.45, '#cfae6c'); og.addColorStop(1, '#6e5530');
  ctx.globalAlpha = m * ease((t - T0 - 500) / 600); ctx.fillStyle = og; ctx.beginPath(); ctx.arc(512, 477, 128, 0, 2 * PI); ctx.fill();
  ctx.globalAlpha = m; const lg = ctx.createLinearGradient(0, 250, 0, 760); lg.addColorStop(0, '#f4e2b8'); lg.addColorStop(.45, '#d4b376'); lg.addColorStop(1, '#9a7b44');
  ctx.strokeStyle = lg; ctx.lineWidth = 34; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.setLineDash([1500, 1500]); ctx.lineDashOffset = 1500 * (1 - ease((t - T0 - 100) / 1100)); ctx.stroke(ARC); ctx.setLineDash([]);
  ctx.restore();
  text('STOIKOS', W / 2, 1010 + (1 - out((t - T0 - 700) / 700)) * 18, '600 100px Cinzel', CREAM, out((t - T0 - 700) / 700), 'center', 16);
  lines(L.tag, 1120, 62, out((t - T0 - 1200) / 700), GOLD, 1.2, 14);
  const ca = out((t - T0 - 1350) / 500);
  if (ca > 0) { ctx.save(); ctx.globalAlpha = ca; ctx.font = '500 36px Jost'; ctx.letterSpacing = '2px';
    const tw = ctx.measureText(L.cta).width + 96; ctx.fillStyle = GOLD; ctx.beginPath(); ctx.roundRect(W / 2 - tw / 2, 1240, tw, 76, 38); ctx.fill();
    ctx.fillStyle = '#1a1610'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(L.cta, W / 2 + 1, 1279); ctx.restore(); }
}

// ── kare ────────────────────────────────────────────────────
function renderFrame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.letterSpacing = '0px';
  bg(t);
  if (t < 5000) scene0(t);
  if (t > 4500 && t < 10800) scene1(t);
  if (t > 10100 && t < 17700) scene2(t);
  if (t > 17100 && t < 24800) scene3(t);
  if (t > 24100 && t < 27600) scene4(t);
  sceneEnd(t);
  const g = ctx.createRadialGradient(W / 2, H * .5, 520, W / 2, H * .5, 1250);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.45)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const fade = Math.max(1 - clamp(t / 600), clamp((t - (DUR - 600)) / 600));
  if (fade > 0) { ctx.fillStyle = `rgba(6,5,4,${fade})`; ctx.fillRect(0, 0, W, H); }
}
