const $ = (id) => document.getElementById(id);
const clamp = (x,a=0,b=1) => Math.max(a, Math.min(b, x));
const ease = (x) => { x = clamp(x); return x<.5 ? 4*x*x*x : 1 - Math.pow(-2*x+2,3)/2; };
const out = (x) => 1 - Math.pow(1 - clamp(x), 3);
const win = (t, a, b, fi=450, fo=450) => clamp((t-a)/fi) * (1 - clamp((t-(b-fo))/fo));
let L, B, petals = [];

function init(lang) {
  L = T[lang];
  B = window.BOXES[lang];
  const pre = `../../docs/sosyal-medya/animasyon/gun/${lang}-`;
  ['home','home-mood','coach','practice','progress'].forEach(n => {
    const a = $('a-' + n); a.querySelector('.content').style.backgroundImage = `url('${pre}${n}.jpg')`;
    a.querySelector('.tabs').style.backgroundImage = `url('${pre}${n}.jpg')`;
    const im = new Image(); im.src = `${pre}${n}.jpg`; im.style.display = 'none'; document.body.appendChild(im);
  });
  document.querySelectorAll('.lock .date').forEach(d => d.textContent = L.date);
  document.querySelectorAll('.notif .now').forEach(d => d.textContent = L.now);
  $('notifM').querySelector('.b').textContent = L.notifM; $('notifE').querySelector('.b').textContent = L.notifE;
  $('title').querySelector('.t').textContent = L.title; $('title').querySelector('.s').textContent = L.titleSub;
  $('tag').innerHTML = L.tag.replace('\n', '<br>'); $('cta').querySelector('span').textContent = L.cta;
  const st = $('stars'); st.innerHTML = '';
  for (let i = 0; i < 40; i++) { const s = document.createElement('div'); s.className = 'star abs';
    s.style.left = ((i * 263) % 1060 + 10) + 'px'; s.style.top = ((i * 157) % 700 + 40) + 'px'; st.appendChild(s); }
  const fo = $('flowerOv'); fo.innerHTML = ''; petals = [];
  for (let i = 0; i < 6; i++) { const p = document.createElement('div'); p.className = 'p'; fo.appendChild(p); petals.push(p); }
}

// ekranlar arası geçiş: [başlangıç, bitiş] görünür olduğu aralık
const SHOW = { lockM:[4400, 7700], 'a-home':[7500, 19600], 'a-home-mood':[16900, 20300], 'a-coach':[20100, 26400], lockE:[26200, 29000],
  'a-practice':[28800, 35800], 'a-progress':[35600, 41800] };
// kaydırma anahtar kareleri (ms, css y)
const SCROLL = {
  'a-home': [[7500,0],[11600,0],[12800,300],[15400,300],[16400,560]],
  'a-home-mood': [[16900,560],[17700,560],[18700,760]],
  'a-coach': [[20100,0],[21800,0],[25200,420]],
  'a-practice': [[28800,520],[35800,560]],
  'a-progress': [[35600,0],[37600,0],[40400,260]],
};
function scrollAt(id, t) {
  const k = SCROLL[id]; if (!k) return 0;
  if (t <= k[0][0]) return k[0][1];
  for (let i = 1; i < k.length; i++) if (t <= k[i][0]) { const a = k[i-1], b = k[i]; return a[1] + (b[1]-a[1]) * ease((t - a[0]) / (b[0] - a[0])); }
  return k[k.length-1][1];
}
const c = (b) => [b.x + b.width/2, b.y + b.height/2];

function renderFrame(t) {
  // gökyüzü
  const sky = { skyNight: 1 - win(t, 3800, 42400, 900, 900),
    skyDawn: win(t, 3800, 15800, 900, 900), skyDay: win(t, 15000, 26600, 900, 900),
    skyDusk: win(t, 25800, 36000, 900, 900), skyGold: win(t, 35200, 48000, 900, 1) };
  for (const k in sky) $(k).style.opacity = sky[k];
  $('sun').style.opacity = win(t, 4600, 26200, 1400, 1200);
  $('sun').style.transform = `translate(${-200 + (t-4600)/21600*260}px, ${180 - Math.sin(clamp((t-4600)/21600)*Math.PI)*260}px)`;
  $('moon').style.opacity = win(t, 27000, 35800, 1400, 1000);
  document.querySelectorAll('.star').forEach((s, i) => s.style.opacity = win(t, 26800 + i*30, 36000, 1200, 900) * (.35 + .5*((Math.sin(t/400 + i) + 1)/2)));

  // başlık (açılış)
  const tw = win(t, 300, 4200, 700, 600);
  $('title').style.opacity = tw; $('title').style.transform = `translateY(${(1-out((t-300)/700))*30}px)`;

  // sahne yazıları; gündüz açık zemin → koyu yazı
  const si = SC.findIndex(s => t >= s[0] && t < s[1]);
  $('cap').className = si === 1 ? 'light' : '';
  if (si >= 0) {
    const s = L.scenes[si], [a, b] = SC[si];
    $('chip').querySelector('span').textContent = s.chip; $('hl').textContent = s.hl;
    $('chip').style.opacity = win(t, a + 100, b, 450, 400); $('hl').style.opacity = win(t, a + 300, b, 500, 400);
    $('hl').style.transform = `translateY(${(1-out((t-a-300)/500))*24}px)`;
    const subT = { 0:[[4900,7600],[8300,12000],[12400,15400]], 1:[[15700,17000],[17000,20000],[20100,26200]], 2:[[26700,29300],[29300,35600]], 3:[[36000,41600]] }[si];
    ['sb1','sb2','sb3'].forEach((id, j) => { const w = subT[j]; const txt = s.sb[j];
      $(id).textContent = txt || ''; $(id).style.opacity = w && txt ? win(t, w[0], w[1], 400, 350) : 0; });
  } else { ['chip','hl','sb1','sb2','sb3'].forEach(id => $(id).style.opacity = 0); }

  // telefon
  const pin = out((t - 4200) / 900), pout = ease((t - 41400) / 800);
  const pw = $('phoneWrap'); pw.style.opacity = pin * (1 - pout);
  pw.style.transform = `translateY(${(1-pin)*500 + pout*700}px)`;
  $('phone').style.transform = `rotateY(${Math.sin(t/2600)*5}deg) rotateX(${2 + Math.sin(t/3400)*2}deg)`;
  $('clock').textContent = t > 26000 ? '21:00' : '09:00';
  for (const id in SHOW) { const [a, b] = SHOW[id]; $(id).style.opacity = win(t, a, b, 350, 350); }
  for (const id in SCROLL) $(id).querySelector('.content').style.transform = `translateY(${-scrollAt(id, t) * K}px)`;
  // bildirimler
  ['notifM', 'notifE'].forEach((id, j) => { const a = j ? 26900 : 5300; const k = out((t - a) / 600);
    $(id).style.opacity = clamp((t - a) / 250); $(id).style.transform = `translateY(${(1-k)*-140}px) scale(${.96 + .04*k})`; });

  // dokunuşlar: [zaman, ekran, css x, css y]
  const sc = (id, ty) => scrollAt(id, ty);
  const TAPS = [
    [7150, 284, 470],                                                     // sabah bildirimi (telefon px)
    [8600, c(B.breath)[0]*K, (c(B.breath)[1] - 110 - sc('a-home', 8600))*K + 56],   // çiçek
    [13600, c(B.resume)[0]*K + 120, (c(B.resume)[1] + 50 - sc('a-home', 13600))*K + 56], // kaldığın yer
    [16650, c(B.mood)[0]*K, (c(B.mood)[1] - sc('a-home', 16650))*K + 56],           // duygu çipi
    [19750, 215*K, 1208 - 41],                                            // koç sekmesi
    [28650, 284, 470],                                                    // akşam bildirimi
  ];
  const tp = $('tap'); let shown = 0;
  for (const [ta, x, y] of TAPS) { const d = t - ta; if (d > -250 && d < 650) {
      const k = clamp((d + 250) / 250), r = clamp(d / 650);
      tp.style.left = x + 'px'; tp.style.top = y + 'px';
      tp.style.opacity = d < 0 ? k : 1 - r; tp.style.transform = `scale(${d < 0 ? 1.15 - .15*k : 1 + r*.9})`; shown = 1; } }
  if (!shown) tp.style.opacity = 0;

  // canlı nefes çiçeği ekran görüntüsündeki çiçeğin üstünde (8,6–11,8 sn)
  const fx = 215*K, fy = (c(B.breath)[1] - 112 - scrollAt('a-home', t))*K + 56;
  const fl = win(t, 8700, 11900, 300, 400);
  const br = (Math.sin((t - 8700) / 3000 * Math.PI * 2 - Math.PI/2) + 1) / 2;
  $('flowerOv').style.left = fx + 'px'; $('flowerOv').style.top = fy + 'px'; $('flowerOv').style.opacity = fl;
  petals.forEach((p, i) => { const a = i/6*Math.PI*2 + br*Math.PI/3; const r = 6 + 52*br;
    p.style.transform = `translate(${Math.cos(a)*r}px, ${Math.sin(a)*r}px) scale(${.55 + .5*br})`; });

  // akşam: günlüğe yazılıyor
  const ty = $('typing'); const jy = (c(B.journal)[1] + 226 - scrollAt('a-practice', t)) * K;
  ty.style.left = (50*K) + 'px'; ty.style.top = jy + 'px'; ty.style.width = (330*K) + 'px';
  const n = Math.floor(clamp((t - 30600) / 2600) * L.typing.length);
  ty.innerHTML = L.typing.slice(0, n) + (Math.floor(t / 450) % 2 ? '<b></b>' : '<b style="opacity:0"></b>');
  ty.style.opacity = win(t, 30200, 35800, 300, 300);

  // karakter: açılışta ortada, uygulama sahnelerinde sol altta küçük, kapanışta ortada bağdaş
  const small = ease((t - 3600) / 900) * (1 - ease((t - 41600) / 900));
  const fin = ease((t - 41800) / 900);
  const hx = 540 - 400*small, hy = (1560 + 220*small) + 140*fin, hs = (1 - .68*small) * (1 - .12*fin);
  const h = $('hero'); h.style.left = hx + 'px'; h.style.top = (hy - 900) + 'px';
  h.style.transform = `scale(${hs * (1 + Math.sin(t/700)*.006)})`;
  h.style.opacity = 1 - clamp((t - 47400) / 500);
  const worried = win(t, 15400, 17000, 300, 400);           // zor an: kaşlar çatık
  $('eyesOpen').setAttribute('opacity', 1); $('eyesClosed').setAttribute('opacity', 0);
  if (t > 42800) { $('eyesOpen').setAttribute('opacity', 0); $('eyesClosed').setAttribute('opacity', 1); }
  $('mouthWorry').setAttribute('opacity', worried); $('mouthSmile').setAttribute('opacity', 1 - worried);
  $('browL').setAttribute('transform', `rotate(${10*worried} 250 106)`); $('browR').setAttribute('transform', `rotate(${-10*worried} 270 106)`);
  const sit = fin;
  ['cloakStand','tunicStand','armsStand','feet','beltTail'].forEach(id => $(id).setAttribute('opacity', 1 - sit));
  ['cloakSit','legsSit','tunicSitTop','armsSit'].forEach(id => $(id).setAttribute('opacity', sit));
  ['cloakSit','tunicSitTop','armsSit','belt','collar','neck','headG'].forEach(id => $(id).setAttribute('transform', `translate(0 ${170*sit})`));

  // kapanış
  const m = out((t - 42200) / 900);
  $('mark').style.opacity = m; $('mark').style.transform = `scale(${0.85 + 0.15*m})`;
  $('mkArc').style.strokeDasharray = '1400'; $('mkArc').style.strokeDashoffset = 1400 * (1 - ease((t - 42200) / 1400));
  $('mkOrbC').setAttribute('opacity', ease((t - 43100) / 700));
  $('brand').style.opacity = out((t - 43400) / 700);
  $('tag').style.opacity = out((t - 44000) / 700);
  $('cta').style.opacity = out((t - 44700) / 700);
  $('stage').style.opacity = 1 - clamp((t - 47500) / 500);
}
window.init = init; window.renderFrame = renderFrame;
</script>
</body>
</html>
