<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* "Benimle 5 nefes al" — 53 sn dikey Reels. Çiçek, components/BreathOrb.tsx'in
     2,67 katı; nefes ritmi uygulamadakiyle aynı (4,5 sn al, 4,5 sn ver). */
  @font-face { font-family:'Cinzel'; font-weight:600;
    src:url('../../node_modules/@expo-google-fonts/cinzel/Cinzel_600SemiBold.ttf') format('truetype'); }
  @font-face { font-family:'Cormorant'; font-style:italic; font-weight:400;
    src:url('../../node_modules/@expo-google-fonts/cormorant-garamond/CormorantGaramond_400Regular_Italic.ttf') format('truetype'); }
  @font-face { font-family:'Jost'; font-weight:300;
    src:url('../../node_modules/@expo-google-fonts/jost/Jost_300Light.ttf') format('truetype'); }

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:#14120e; }
  #stage { position:relative; width:1080px; height:1920px; overflow:hidden; background:#14120e; }
  #glow { position:absolute; left:50%; top:46%; width:1700px; height:1700px; transform:translate(-50%,-50%); border-radius:50%;
    background:radial-gradient(circle, rgba(194,168,120,.18) 0%, rgba(194,168,120,.06) 40%, rgba(194,168,120,0) 70%); }

  .layer { position:absolute; inset:0; display:grid; place-items:center; }
  .block { width:880px; text-align:center; }
  .say { font-family:'Cormorant'; font-style:italic; font-size:84px; line-height:1.3; color:#ece4d4; }
  .sub { font-family:'Jost'; font-weight:300; font-size:38px; letter-spacing:2px; color:#8a8070; margin-top:30px; }

  #orbWrap { position:absolute; left:50%; top:860px; width:0; height:0; }
  #halo { position:absolute; left:-280px; top:-280px; width:560px; height:560px; border-radius:50%;
    background:rgba(240,196,120,.22); filter:blur(30px); }
  #flower { position:absolute; left:0; top:0; width:0; height:0; }
  .petal { position:absolute; left:-128px; top:-128px; width:256px; height:256px; border-radius:50%; }
  .petal.a { background:linear-gradient(135deg, rgba(255,236,196,.62), rgba(224,184,112,.38) 50%, rgba(160,120,60,.20)); }
  .petal.b { background:linear-gradient(135deg, rgba(248,210,150,.56), rgba(212,160,92,.34) 50%, rgba(140,100,48,.18)); }

  #phase { position:absolute; left:0; right:0; top:1280px; text-align:center;
    font-family:'Cormorant'; font-style:italic; font-size:96px; color:#ece4d4; }
  #count { position:absolute; left:0; right:0; top:1420px; text-align:center;
    font-family:'Jost'; font-weight:300; font-size:36px; letter-spacing:4px; color:#8a8070; }

  #mk { width:220px; height:220px; display:block; margin:0 auto 40px; }
  .word { font-family:'Cinzel'; font-weight:600; font-size:96px; letter-spacing:16px; color:#d8c49a; }
  .url { font-family:'Jost'; font-weight:300; font-size:40px; letter-spacing:3px; color:#c2a878; margin-top:30px; }
</style>
</head>
<body>
<div id="stage">
  <div id="glow"></div>

  <div class="layer" id="L1"><div class="block"><div class="say" id="l1"></div><div class="sub" id="l1s"></div></div></div>

  <div id="orbWrap"><div id="halo"></div><div id="flower">
    <div class="petal a"></div><div class="petal b"></div><div class="petal a"></div>
    <div class="petal b"></div><div class="petal a"></div><div class="petal b"></div>
  </div></div>
  <div id="phase"></div>
  <div id="count"></div>

  <div class="layer" id="L3"><div class="block">
    <svg id="mk" viewBox="192 162 640 640" aria-hidden="true">
      <defs>
        <linearGradient id="mkG" x1="0" y1="250" x2="0" y2="760" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#f4e2b8"/><stop offset=".45" stop-color="#d4b376"/><stop offset="1" stop-color="#9a7b44"/>
        </linearGradient>
        <radialGradient id="mkO" cx="42%" cy="36%" r="70%">
          <stop offset="0" stop-color="#f6e6c0"/><stop offset=".45" stop-color="#cfae6c"/><stop offset="1" stop-color="#6e5530"/>
        </radialGradient>
        <radialGradient id="mkW" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#e2b874" stop-opacity=".45"/><stop offset="1" stop-color="#e2b874" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle cx="512" cy="477" r="292" fill="none" stroke="#d4b376" stroke-opacity=".13" stroke-width="4"/>
      <circle cx="512" cy="477" r="200" fill="url(#mkW)"/>
      <circle cx="512" cy="477" r="128" fill="url(#mkO)"/>
      <path d="M296 688 H415 A232 232 0 1 1 609 688 H728" fill="none" stroke="url(#mkG)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="say" id="l3"></div>
    <div class="word" style="margin-top:60px">STOIKOS</div>
    <div class="url">stoikos.app</div>
  </div></div>
</div>

<script>
const COPY = {
  tr: { intro:'Benimle beş nefes al.', introSub:'Telefonu bırakmana gerek yok.', inh:'Nefes al', exh:'Nefes ver',
        end:'Günde bir dakika yeter.' },
  en: { intro:'Take five breaths with me.', introSub:'No need to put your phone down.', inh:'Breathe in', exh:'Breathe out',
        end:'One minute a day is enough.' },
};
const BREATHS = 5, HALF = 4500, START = 3600;            // ms
const END = START + BREATHS * HALF * 2;                   // 48 600
const TOTAL = END + 4600;                                  // 53 200

const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const pr = (t, t0, t1) => cl((t - t0) / (t1 - t0));
const ease = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const fade = (t, a, b, c, d) => ease(pr(t, a, b)) * (1 - ease(pr(t, c, d)));
const mix = (a, b, x) => a + (b - a) * x;
const sine = (x) => (1 - Math.cos(x * Math.PI)) / 2;
let L;

function renderFrame(t) {
  const $ = (id) => document.getElementById(id);
  $('glow').style.opacity = 0.5 + 0.5 * ease(pr(t, 2000, 4000));

  // Giriş
  $('L1').style.opacity = fade(t, 200, 900, 2700, 3300);

  // Çiçek: girişte yarı açık bekler, sonra uygulamadaki gibi kapanıp nefese başlar
  let breath, phase = '', n = 0;
  if (t < START) {
    breath = mix(0.4, 0, ease(pr(t, 2700, START)));             // hazırlık: kapan
  } else if (t < END) {
    const k = (t - START) / HALF, i = Math.floor(k), x = k - i;
    const inhale = i % 2 === 0;
    breath = inhale ? sine(x) : 1 - sine(x);
    phase = inhale ? L.inh : L.exh;
    n = Math.floor(i / 2) + 1;
  } else {
    breath = 0;
  }
  const flowerOp = fade(t, 2400, 3200, END - 200, END + 900);
  $('orbWrap').style.opacity = flowerOp;
  $('flower').style.transform = `rotate(${(60 * breath).toFixed(2)}deg) scale(${mix(0.92, 1.06, breath).toFixed(4)})`;
  $('halo').style.opacity = mix(0.12, 0.42, breath);
  $('halo').style.transform = `scale(${mix(0.92, 1.06, breath).toFixed(4)})`;
  const ps = mix(0.5, 1, breath);
  [...document.querySelectorAll('.petal')].forEach((el, i) => {
    const a = (i / 6) * Math.PI * 2 - Math.PI / 2;
    el.style.transform = `translate(${(Math.cos(a) * 128 * breath).toFixed(2)}px, ${(Math.sin(a) * 128 * breath).toFixed(2)}px) scale(${ps.toFixed(4)})`;
  });

  // Yazı her yarı döngünün başında yumuşakça değişir
  const local = t >= START && t < END ? ((t - START) % HALF) : 0;
  const textOp = t >= START && t < END ? cl(Math.min(local / 500, (HALF - local) / 400)) : 0;
  $('phase').textContent = phase;
  $('phase').style.opacity = textOp * flowerOp;
  $('count').textContent = n ? `${n} / ${BREATHS}` : '';
  $('count').style.opacity = flowerOp;

  // Kapanış
  $('L3').style.opacity = fade(t, END + 700, END + 1600, TOTAL + 1000, TOTAL + 2000);
}

function init(lang) {
  L = COPY[lang] || COPY.tr;
  document.getElementById('l1').textContent = L.intro;
  document.getElementById('l1s').textContent = L.introSub;
  document.getElementById('l3').textContent = L.end;
  renderFrame(0);
}
window.init = init;
window.renderFrame = renderFrame;
window.TOTAL = TOTAL;
</script>
</body>
</html>
